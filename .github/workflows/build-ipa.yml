name: Build IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate production food database
        run: |
          python3 scripts/import_food_db.py \
            --input Densoso/Resources/seed_foods.json \
            --manifest Densoso/Resources/FoodData/sources.json \
            --output Densoso/Resources/food_composition.db \
            --production
          test -s Densoso/Resources/food_composition.db

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          xcodebuild -project Densoso.xcodeproj \
            -scheme Densoso \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            -configuration Release \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify bundled food database
        run: test -s DerivedData/Build/Products/Release-iphoneos/Densoso.app/food_composition.db

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH=DerivedData/Build/Products/Release-iphoneos/Densoso.app
          test -s "$APP_PATH/food_composition.db"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          test -s Payload/Densoso.app/food_composition.db
          zip -ry Densoso.ipa Payload/
          unzip -Z1 Densoso.ipa | grep -Fx 'Payload/Densoso.app/food_composition.db'
          rm -rf Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Densoso.ipa
          path: Densoso.ipa
          if-no-files-found: error
