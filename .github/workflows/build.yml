name: V3 Gates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_scope:
        description: Select the standard chain or this PR's focused test gates.
        required: true
        type: choice
        options:
          - full
          - focused-pr-tests
        default: full

concurrency:
  group: v3-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Later jobs are added only when their production code and tests exist:
  # foundation -> domain-persistence -> agent-provider -> speech ->
  # meal-capture -> healthkit -> health-intelligence -> watch -> integration.
  foundation:
    name: gate-01-foundation
    if: ${{ always() && inputs.run_scope != 'focused-pr-tests' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Gate 1 paths
        id: set_paths
        run: |
          echo "DERIVED_DATA_PATH=$RUNNER_TEMP/DensosoDerivedData" >> "$GITHUB_ENV"
          echo "UNIT_RESULT_BUNDLE=$GITHUB_WORKSPACE/Gate01UnitTests.xcresult" >> "$GITHUB_ENV"
          echo "UI_RESULT_BUNDLE=$GITHUB_WORKSPACE/Gate01UITests.xcresult" >> "$GITHUB_ENV"

      - name: Validate Python scripts
        id: validate_python
        if: always()
        run: |
          set -o pipefail
          python3 -m py_compile \
            scripts/evaluate_voice_transcripts.py \
            scripts/generate_voice_goldens.py \
            scripts/import_exercise_catalog.py \
            scripts/import_food_db.py \
            scripts/validate_food_db.py \
            scripts/validate_gate0_ui.py \
            scripts/validate_phase1_foundation.py \
            scripts/validate_phase2_domain_persistence.py \
            scripts/validate_phase3_agent_provider.py \
            scripts/validate_phase4_speech.py \
            scripts/validate_phase5_meal_capture.py \
            scripts/validate_phase6_healthkit.py \
            scripts/validate_phase7_health_intelligence.py \
            scripts/validate_phase8_watch.py \
            scripts/validate_phase9_integration.py \
            scripts/validate_phase10_final_acceptance.py \
            scripts/validate_phase11_14_gates.py \
            scripts/validate_gate17_food_data.py \
            scripts/validate_gate19_privacy_window.py \
            scripts/validate_recipe_priors.py \
            scripts/aggregate_gate16_release_readiness.py \
            scripts/validate_gate16_aggregate.py \
            scripts/validate_xcresult_test_manifest.py \
            scripts/validate_swiftpm_test_manifest.py \
            scripts/validate_voice_goldens.py 2>&1 | tee gate01-python-validation.log

      - name: Validate fail-closed Gate 16 aggregation
        id: validate_gate16_aggregate
        if: always()
        run: |
          set -o pipefail
          python3 scripts/validate_gate16_aggregate.py 2>&1 | tee gate01-gate16-aggregate.log

      - name: Validate bundled food database
        id: validate_food_db
        if: always()
        run: |
          set -o pipefail
          python3 scripts/validate_food_db.py 2>&1 | tee gate01-food-db.log

      - name: Validate voice routing goldens
        id: validate_voice_goldens
        if: always()
        run: |
          set -o pipefail
          python3 scripts/validate_voice_goldens.py --input evals/voice-zh-CN.jsonl 2>&1 | tee gate01-voice-goldens.log

      - name: Validate Gate 0 UI structure
        id: validate_gate0_ui
        if: always()
        run: |
          set -o pipefail
          python3 scripts/validate_gate0_ui.py 2>&1 | tee gate01-ui-structure.log

      - name: Validate Phase 1 static contracts
        id: validate_phase1
        if: always()
        run: |
          set -o pipefail
          python3 scripts/validate_phase1_foundation.py 2>&1 | tee gate01-phase1-contracts.log

      - name: Test pure DensosoDomain package
        id: domain_tests
        if: always()
        run: |
          set -o pipefail
          swift test --package-path Packages/DensosoDomain 2>&1 | tee gate01-domain.log

      - name: Install XcodeGen
        id: install_xcodegen
        if: always()
        run: brew install xcodegen

      - name: Generate Xcode project
        id: generate_project
        if: ${{ always() && steps.install_xcodegen.outcome == 'success' }}
        run: xcodegen generate

      - name: Verify deterministic XcodeGen output
        id: xcodegen_determinism
        if: ${{ always() && steps.generate_project.outcome == 'success' }}
        run: |
          set -euo pipefail
          cp -R Densoso.xcodeproj "$RUNNER_TEMP/Densoso.first.xcodeproj"
          rm -rf Densoso.xcodeproj
          xcodegen generate
          diff -ru "$RUNNER_TEMP/Densoso.first.xcodeproj" Densoso.xcodeproj \
            | tee gate01-xcodegen-determinism.log

      - name: Prepare iOS 26 Simulator
        id: prepare_simulator
        if: ${{ always() && steps.generate_project.outcome == 'success' && steps.set_paths.outcome == 'success' }}
        run: |
          set -euo pipefail
          SIMULATOR_LIST="$(perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl list devices available)"
          SIMULATOR_UDID="$(printf '%s\n' "$SIMULATOR_LIST" | sed -n 's/.*iPhone 17 Pro (\([A-F0-9-]*\)).*/\1/p' | sed -n '1p')"
          test -n "$SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl boot "$SIMULATOR_UDID" || true
          perl -e 'alarm shift; exec @ARGV' 180 xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build with iOS 18 deployment target
        id: ios18_build
        if: ${{ always() && steps.generate_project.outcome == 'success' && steps.set_paths.outcome == 'success' }}
        run: |
          set -o pipefail
          perl -e 'alarm shift; exec @ARGV' 720 xcodebuild -project Densoso.xcodeproj \
            -scheme Densoso \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee gate01-ios18-build.log

      - name: Test units on iOS 26 Simulator
        id: unit_tests
        if: ${{ always() && steps.prepare_simulator.outcome == 'success' && steps.set_paths.outcome == 'success' }}
        run: |
          set -o pipefail
          rm -rf "$UNIT_RESULT_BUNDLE"
          perl -e 'alarm shift; exec @ARGV' 720 xcodebuild -project Densoso.xcodeproj \
            -scheme Densoso \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 120 \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -only-testing:DensosoTests \
            -enableCodeCoverage YES \
            -resultBundlePath "$UNIT_RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee gate01-unit-tests.log

      - name: Test UI fixtures and capture screenshots
        id: ui_tests
        if: ${{ always() && steps.prepare_simulator.outcome == 'success' && steps.set_paths.outcome == 'success' }}
        run: |
          set -o pipefail
          rm -rf "$UI_RESULT_BUNDLE"
          perl -e 'alarm shift; exec @ARGV' 900 xcodebuild -project Densoso.xcodeproj \
            -scheme Densoso \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 120 \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -only-testing:DensosoUITests \
            -resultBundlePath "$UI_RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee gate01-ui-tests.log

      - name: Export UI screenshot attachments
        id: screenshot_export
        if: ${{ always() && steps.ui_tests.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          rm -rf Gate01Screenshots
          mkdir -p Gate01Screenshots
          xcrun xcresulttool export attachments \
            --path "$UI_RESULT_BUNDLE" \
            --output-path Gate01Screenshots
          SCREENSHOT_COUNT="$(find Gate01Screenshots -type f -name '*.png' | wc -l | tr -d ' ')"
          test "$SCREENSHOT_COUNT" -ge 5
          echo "Exported $SCREENSHOT_COUNT Gate 1 screenshots."

      - name: Build Watch app and extension
        id: watch_build
        if: ${{ always() && steps.generate_project.outcome == 'success' && steps.set_paths.outcome == 'success' }}
        run: |
          set -o pipefail
          perl -e 'alarm shift; exec @ARGV' 720 xcodebuild -project Densoso.xcodeproj \
            -scheme DensosoWatch \
            -destination "generic/platform=watchOS Simulator" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            WATCHOS_DEPLOYMENT_TARGET=11.0 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee gate01-watch-build.log

      - name: Validate built launch screen
        id: launch_screen
        if: ${{ always() && steps.ios18_build.outcome == 'success' && steps.set_paths.outcome == 'success' }}
        run: |
          set -euo pipefail
          APP_BUNDLE="$DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator/Densoso.app"
          test -d "$APP_BUNDLE"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$APP_BUNDLE/Info.plist")" = "LaunchScreen"
          test -d "$APP_BUNDLE/LaunchScreen.storyboardc"

      - name: Record Gate 1 execution status
        if: always()
        env:
          PATH_SETUP_OUTCOME: ${{ steps.set_paths.outcome }}
          PYTHON_VALIDATION_OUTCOME: ${{ steps.validate_python.outcome }}
          FOOD_DB_VALIDATION_OUTCOME: ${{ steps.validate_food_db.outcome }}
          VOICE_GOLDENS_OUTCOME: ${{ steps.validate_voice_goldens.outcome }}
          GATE0_UI_OUTCOME: ${{ steps.validate_gate0_ui.outcome }}
          PHASE1_CONTRACTS_OUTCOME: ${{ steps.validate_phase1.outcome }}
          DOMAIN_TESTS_OUTCOME: ${{ steps.domain_tests.outcome }}
          XCODEGEN_INSTALL_OUTCOME: ${{ steps.install_xcodegen.outcome }}
          PROJECT_GENERATION_OUTCOME: ${{ steps.generate_project.outcome }}
          XCODEGEN_DETERMINISM_OUTCOME: ${{ steps.xcodegen_determinism.outcome }}
          SIMULATOR_SETUP_OUTCOME: ${{ steps.prepare_simulator.outcome }}
          IOS18_BUILD_OUTCOME: ${{ steps.ios18_build.outcome }}
          UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
          UI_TESTS_OUTCOME: ${{ steps.ui_tests.outcome }}
          SCREENSHOT_EXPORT_OUTCOME: ${{ steps.screenshot_export.outcome }}
          WATCH_BUILD_OUTCOME: ${{ steps.watch_build.outcome }}
          LAUNCH_SCREEN_OUTCOME: ${{ steps.launch_screen.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          steps = {
              "path_setup": os.environ["PATH_SETUP_OUTCOME"],
              "python_validation": os.environ["PYTHON_VALIDATION_OUTCOME"],
              "food_database_validation": os.environ["FOOD_DB_VALIDATION_OUTCOME"],
              "voice_goldens": os.environ["VOICE_GOLDENS_OUTCOME"],
              "gate0_ui_validation": os.environ["GATE0_UI_OUTCOME"],
              "phase1_contracts": os.environ["PHASE1_CONTRACTS_OUTCOME"],
              "domain_tests": os.environ["DOMAIN_TESTS_OUTCOME"],
              "xcodegen_install": os.environ["XCODEGEN_INSTALL_OUTCOME"],
              "project_generation": os.environ["PROJECT_GENERATION_OUTCOME"],
              "xcodegen_determinism": os.environ["XCODEGEN_DETERMINISM_OUTCOME"],
              "simulator_setup": os.environ["SIMULATOR_SETUP_OUTCOME"],
              "ios18_build": os.environ["IOS18_BUILD_OUTCOME"],
              "unit_tests": os.environ["UNIT_TESTS_OUTCOME"],
              "ui_tests": os.environ["UI_TESTS_OUTCOME"],
              "screenshot_export": os.environ["SCREENSHOT_EXPORT_OUTCOME"],
              "watch_build": os.environ["WATCH_BUILD_OUTCOME"],
              "launch_screen_validation": os.environ["LAUNCH_SCREEN_OUTCOME"],
          }
          evidence_paths = [
              "gate01-python-validation.log",
              "gate01-food-db.log",
              "gate01-voice-goldens.log",
              "gate01-ui-structure.log",
              "gate01-phase1-contracts.log",
              "gate01-domain.log",
              "gate01-xcodegen-determinism.log",
              "gate01-ios18-build.log",
              "gate01-unit-tests.log",
              "gate01-ui-tests.log",
              "gate01-watch-build.log",
              "Gate01UnitTests.xcresult",
              "Gate01UITests.xcresult",
              "Gate01Screenshots",
          ]
          evidence = {path: Path(path).exists() for path in evidence_paths}
          results = {
              name: {
                  "status": "PASS" if outcome == "success" else "FAIL" if outcome == "failure" else "NOT RUN",
                  "outcome": outcome,
              }
              for name, outcome in steps.items()
          }
          failed = [name for name, result in results.items() if result["status"] == "FAIL"]
          not_run = [name for name, result in results.items() if result["status"] == "NOT RUN"]
          report = {
              "schemaVersion": 1,
              "gate": "gate-01-foundation",
              "headSha": os.environ.get("GITHUB_SHA"),
              "runId": os.environ.get("GITHUB_RUN_ID"),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "status": "FAIL" if failed or not_run else "PASS",
              "steps": results,
              "evidenceFiles": evidence,
              "diagnostics": [
                  f"Step {name} did not run; inspect the first failed prerequisite in the job log."
                  for name in not_run
              ] + [
                  f"Evidence file missing: {path}"
                  for path, exists in evidence.items()
                  if not exists
              ],
          }
          Path("gate01-execution-summary.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          if report["status"] != "PASS":
              sys.exit(1)
          PY

      - name: Upload Gate 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-01-foundation-results
          path: |
            Gate01UnitTests.xcresult
            Gate01UITests.xcresult
            Gate01Screenshots
            gate01-*.log
            gate01-execution-summary.json
          if-no-files-found: warn
          retention-days: 14

  domain-persistence:
    name: gate-02-domain-persistence
    needs: foundation
    if: ${{ always() && inputs.run_scope != 'focused-pr-tests' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Gate 2 paths
        run: |
          echo "DERIVED_DATA_PATH=$RUNNER_TEMP/DensosoGate02DerivedData" >> "$GITHUB_ENV"
          echo "GATE02_RESULT_BUNDLE=$GITHUB_WORKSPACE/Gate02PersistenceTests.xcresult" >> "$GITHUB_ENV"

      - name: Validate Phase 2 static contracts
        run: |
          python3 -m py_compile scripts/validate_phase2_domain_persistence.py
          python3 scripts/validate_phase2_domain_persistence.py

      - name: Test Phase 2 domain contracts
        run: |
          set -o pipefail
          swift test --package-path Packages/DensosoDomain 2>&1 | tee gate02-domain.log

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare iOS 26 Simulator
        run: |
          set -euo pipefail
          SIMULATOR_LIST="$(perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl list devices available)"
          SIMULATOR_UDID="$(printf '%s\n' "$SIMULATOR_LIST" | sed -n 's/.*iPhone 17 Pro (\([A-F0-9-]*\)).*/\1/p' | sed -n '1p')"
          test -n "$SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl boot "$SIMULATOR_UDID" || true
          perl -e 'alarm shift; exec @ARGV' 180 xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Test migration and confirmation transactions
        run: |
          set -o pipefail
          rm -rf "$GATE02_RESULT_BUNDLE"
          perl -e 'alarm shift; exec @ARGV' 900 xcodebuild -project Densoso.xcodeproj \
            -scheme Densoso \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 120 \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -only-testing:DensosoTests/ConfirmationCoordinatorTests \
            -only-testing:DensosoTests/ConversationPersistenceTests \
            -only-testing:DensosoTests/DensosoMigrationTests \
            -only-testing:DensosoTests/DensosoMigrationTests/testV1DiskFixtureMigratesToCurrentSchemaWithoutRecalculation \
            -only-testing:DensosoTests/ConfirmationCoordinatorTests/testConfirmedActionTraceabilityLinksReceiptLocalRecordAndOutbox \
            -only-testing:DensosoTests/MigrationBackupManagerTests \
            -only-testing:DensosoTests/AgentPersistenceBoundaryTests \
            -only-testing:DensosoTests/HealthRepositoryTests \
            -resultBundlePath "$GATE02_RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee gate02-persistence-tests.log

      - name: Export Gate 2 reports
        run: |
          set -euo pipefail
          rm -rf Gate02Reports
          mkdir -p Gate02Reports
          xcrun xcresulttool export attachments \
            --path "$GATE02_RESULT_BUNDLE" \
            --output-path Gate02Reports
          test -f Gate02Reports/manifest.json
          grep -q 'gate02-v1-migration-report_' Gate02Reports/manifest.json
          grep -q 'gate02-v2-migration-report_' Gate02Reports/manifest.json
          grep -q 'gate02-recovery-report_' Gate02Reports/manifest.json
          xcrun xcresulttool get test-results summary \
            --path "$GATE02_RESULT_BUNDLE" > gate02-test-summary.json

      - name: Upload Gate 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-02-domain-persistence-results
          path: |
            Gate02PersistenceTests.xcresult
            Gate02Reports
            gate02-domain.log
            gate02-persistence-tests.log
            gate02-test-summary.json
          if-no-files-found: warn
          retention-days: 14

  agent-provider:
    name: gate-03-agent-provider
    needs: domain-persistence
    if: ${{ always() && inputs.run_scope != 'focused-pr-tests' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Gate 3 paths
        run: |
          echo "DERIVED_DATA_PATH=$RUNNER_TEMP/DensosoGate03DerivedData" >> "$GITHUB_ENV"
          echo "GATE03_RESULT_BUNDLE=$GITHUB_WORKSPACE/Gate03AgentProviderTests.xcresult" >> "$GITHUB_ENV"

      - name: Validate Phase 3 contracts and fixtures
        id: validate
        continue-on-error: true
        run: |
          python3 -m py_compile scripts/validate_phase3_agent_provider.py
          python3 scripts/validate_phase3_agent_provider.py \
            --report gate03-fixture-summary.json

      - name: Test cumulative domain contracts
        id: domain_tests
        run: |
          set -o pipefail
          swift test --package-path Packages/DensosoDomain 2>&1 | tee gate03-domain.log

      - name: Install XcodeGen
        id: install_xcodegen
        if: always()
        run: brew install xcodegen

      - name: Generate Xcode project
        id: generate_project
        if: ${{ always() && steps.install_xcodegen.outcome == 'success' }}
        run: xcodegen generate

      - name: Prepare iOS 26 Simulator
        id: prepare_simulator
        if: ${{ always() && steps.generate_project.outcome == 'success' }}
        run: |
          set -euo pipefail
          SIMULATOR_LIST="$(perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl list devices available)"
          SIMULATOR_UDID="$(printf '%s\n' "$SIMULATOR_LIST" | sed -n 's/.*iPhone 17 Pro (\([A-F0-9-]*\)).*/\1/p' | sed -n '1p')"
          test -n "$SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl boot "$SIMULATOR_UDID" || true
          perl -e 'alarm shift; exec @ARGV' 180 xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Test Agent Provider Markdown and privacy contracts
        id: xcode_tests
        if: ${{ always() && steps.prepare_simulator.outcome == 'success' }}
        run: |
          set -o pipefail
          rm -rf "$GATE03_RESULT_BUNDLE"
          perl -e 'alarm shift; exec @ARGV' 900 xcodebuild -project Densoso.xcodeproj \
            -scheme Densoso \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 120 \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -only-testing:DensosoTests/DeepSeekProviderContractTests \
            -only-testing:DensosoTests/QwenProviderContractTests \
            -only-testing:DensosoTests/QwenMealVisionProviderContractTests/testQwenVisionRetryRevalidatesCapturedImagePolicyRevision \
            -only-testing:DensosoTests/ProviderRetryPolicyTests \
            -only-testing:DensosoTests/AgentCoordinatorTests \
            -only-testing:DensosoTests/AgentTurnContractTests \
            -only-testing:DensosoTests/LocalIntelligenceSuggestionTests \
            -only-testing:DensosoTests/PromptInjectionEvalTests \
            -only-testing:DensosoTests/AgentBudgetTests \
            -only-testing:DensosoTests/AgentProviderContextPolicyTests \
            -only-testing:DensosoTests/AgentRequestResumeTests \
            -only-testing:DensosoTests/AgentReasoningPolicyTests \
            -only-testing:DensosoTests/ToolSchemaTests \
            -only-testing:DensosoTests/ProviderUsageLedgerTests \
            -only-testing:DensosoTests/RestrictedMarkdownRendererTests \
            -only-testing:DensosoTests/ProviderLogRedactionTests \
            -only-testing:DensosoTests/AgentPersistenceBoundaryTests \
            -only-testing:DensosoTests/IntelligenceRoutingPolicyTests \
            -only-testing:DensosoTests/ConversationPersistenceTests \
            -only-testing:DensosoTests/GetRecentMealsToolTests \
            -only-testing:DensosoTests/GetRecentWorkoutsToolTests \
            -only-testing:DensosoTests/GetGoalToolTests \
            -only-testing:DensosoTests/DailyCheckInConfirmationTests \
            -only-testing:DensosoTests/UserPreferenceConfirmationTests \
            -only-testing:DensosoTests/GetUserPreferencesToolTests \
            -only-testing:DensosoTests/GetTodayPlanToolTests \
            -only-testing:DensosoTests/DailyLoopSnapshotCompositionTests \
            -only-testing:DensosoTests/SwiftDataProviderGovernanceQueryTests \
            -only-testing:DensosoTests/AgentDailyMetricsRepositoryTests \
            -only-testing:DensosoTests/GetMetricsToolTests \
            -only-testing:DensosoTests/GetWeeklyDeficitToolTests \
            -only-testing:DensosoTests/AgentToolOutputLimiterTests \
            -resultBundlePath "$GATE03_RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee gate03-agent-provider-tests.log

      - name: Export Gate 3 test summary
        id: export_summary
        if: ${{ always() && steps.xcode_tests.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary \
            --path "$GATE03_RESULT_BUNDLE" > gate03-test-summary.json
          grep -q '"result" : "Passed"' gate03-test-summary.json

      - name: Record Gate 3 execution status
        if: always()
        env:
          VALIDATOR_OUTCOME: ${{ steps.validate.outcome }}
          DOMAIN_TESTS_OUTCOME: ${{ steps.domain_tests.outcome }}
          XCODEGEN_INSTALL_OUTCOME: ${{ steps.install_xcodegen.outcome }}
          PROJECT_GENERATION_OUTCOME: ${{ steps.generate_project.outcome }}
          SIMULATOR_SETUP_OUTCOME: ${{ steps.prepare_simulator.outcome }}
          XCODE_TESTS_OUTCOME: ${{ steps.xcode_tests.outcome }}
          TEST_SUMMARY_OUTCOME: ${{ steps.export_summary.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          steps = {
              "static_contracts": os.environ["VALIDATOR_OUTCOME"],
              "domain_tests": os.environ["DOMAIN_TESTS_OUTCOME"],
              "xcodegen_install": os.environ["XCODEGEN_INSTALL_OUTCOME"],
              "project_generation": os.environ["PROJECT_GENERATION_OUTCOME"],
              "simulator_setup": os.environ["SIMULATOR_SETUP_OUTCOME"],
              "xcode_tests": os.environ["XCODE_TESTS_OUTCOME"],
              "test_summary_export": os.environ["TEST_SUMMARY_OUTCOME"],
          }
          evidence_paths = [
              "gate03-fixture-summary.json",
              "gate03-domain.log",
              "gate03-agent-provider-tests.log",
              "gate03-test-summary.json",
              "Gate03AgentProviderTests.xcresult",
          ]
          evidence = {path: Path(path).exists() for path in evidence_paths}
          results = {
              name: {
                  "status": "PASS" if outcome == "success" else "FAIL" if outcome == "failure" else "NOT RUN",
                  "outcome": outcome,
              }
              for name, outcome in steps.items()
          }
          failed = [name for name, result in results.items() if result["status"] == "FAIL"]
          not_run = [name for name, result in results.items() if result["status"] == "NOT RUN"]
          report = {
              "schemaVersion": 1,
              "gate": "gate-03-agent-provider",
              "headSha": os.environ.get("GITHUB_SHA"),
              "runId": os.environ.get("GITHUB_RUN_ID"),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "status": "FAIL" if failed or not_run else "PASS",
              "steps": results,
              "evidenceFiles": evidence,
              "diagnostics": [
                  f"Step {name} did not run; inspect the first failed prerequisite in the job log."
                  for name in not_run
              ] + [
                  f"Evidence file missing: {path}"
                  for path, exists in evidence.items()
                  if not exists
              ],
          }
          Path("gate03-execution-summary.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          if report["status"] != "PASS":
              sys.exit(1)

      - name: Upload Gate 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
