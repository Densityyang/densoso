          GATE_05: ${{ needs.meal-capture.result }}
          GATE_06: ${{ needs.healthkit.result }}
          GATE_07: ${{ needs.health-intelligence.result }}
          GATE_08: ${{ needs.watch.result }}
          GATE_09: ${{ needs.integration.result }}
          GATE_10: ${{ needs.final-acceptance.result }}
          GATE_11: ${{ needs.gate-11-ai-native-health-loop.result }}
          GATE_12: ${{ needs.gate-12-multimodal-agent.result }}
          GATE_13: ${{ needs.gate-13-energy-accounting.result }}
          GATE_14: ${{ needs.gate-14-watch-daily-loop.result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          run_scope = os.environ.get("RUN_SCOPE") or "full"
          selected = set(range(1, 15))
          if run_scope == "focused-pr-tests":
              selected = {5, 11, 12, 13, 14}

          gate_jobs = {
              1: ("foundation", "GATE_01", None),
              2: ("domain-persistence", "GATE_02", 1),
              3: ("agent-provider", "GATE_03", 2),
              4: ("speech", "GATE_04", 3),
              5: ("meal-capture", "GATE_05", 4),
              6: ("healthkit", "GATE_06", 5),
              7: ("health-intelligence", "GATE_07", 6),
              8: ("watch", "GATE_08", 7),
              9: ("integration", "GATE_09", 8),
              10: ("final-acceptance", "GATE_10", 9),
              11: ("gate-11-ai-native-health-loop", "GATE_11", 10),
              12: ("gate-12-multimodal-agent", "GATE_12", 11),
              13: ("gate-13-energy-accounting", "GATE_13", 12),
              14: ("gate-14-watch-daily-loop", "GATE_14", 13),
          }
          job_outcomes = {
              number: os.environ[env_name]
              for number, (_, env_name, _) in gate_jobs.items()
          }
          gates = []
          for number, (job, _, predecessor) in gate_jobs.items():
              outcome = job_outcomes[number]
              if outcome == "success":
                  status, reason = "PASS", "job succeeded"
              elif outcome == "failure":
                  status, reason = "FAIL", "job failed; see its retained job artifact and logs"
              elif outcome == "cancelled":
                  status, reason = "BLOCKED", "job was cancelled before completion"
              elif number not in selected:
                  status, reason = "NOT RUN", f"not selected in {run_scope} scope"
              else:
                  status = "BLOCKED"
                  if predecessor is not None and job_outcomes[predecessor] != "success":
                      reason = f"blocked because Gate {predecessor} result was {job_outcomes[predecessor]}"
                  else:
                      reason = "selected job was skipped; inspect its condition and prerequisite logs"
              gates.append({
                  "gate": number,
                  "job": job,
                  "jobOutcome": outcome,
                  "status": status,
                  "reason": reason,
              })

          selected_results = [gate for gate in gates if gate["gate"] in selected]
          overall = "PASS" if all(gate["status"] == "PASS" for gate in selected_results) else "FAIL"
          report = {
              "schemaVersion": 1,
              "workflow": "V3 Gates",
              "headSha": os.environ.get("GITHUB_SHA"),
              "runId": os.environ.get("GITHUB_RUN_ID"),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "runScope": run_scope,
              "status": overall,
              "gates": gates,
          }
          Path("gate-01-to-14-summary.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          lines = [
              "# Gate 1-14 aggregate",
              "",
              f"Scope: `{run_scope}`",
              f"Overall status: **{overall}**",
              "",
              "| Gate | Status | Job result | Reason |",
              "| --- | --- | --- | --- |",
          ]
          lines.extend(
              f"| {gate['gate']:02d} | {gate['status']} | {gate['jobOutcome']} | {gate['reason']} |"
              for gate in gates
          )
          markdown = "\n".join(lines) + "\n"
          Path("gate-01-to-14-summary.md").write_text(markdown, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(markdown)
          print(json.dumps(report, indent=2, sort_keys=True))
          if overall != "PASS":
              sys.exit(1)
          PY

      - name: Upload aggregate status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-01-to-14-aggregate-results
          path: |
            gate-01-to-14-summary.json
            gate-01-to-14-summary.md
          if-no-files-found: warn
          retention-days: 14
