          SIMULATOR_UDID="$(printf '%s\n' "$SIMULATOR_LIST" | sed -n 's/.*iPhone 17 Pro (\([A-F0-9-]*\)).*/\1/p' | sed -n '1p')"
          test -n "$SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl boot "$SIMULATOR_UDID" || true
          perl -e 'alarm shift; exec @ARGV' 180 xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Run complete iOS unit suite with coverage
        run: |
          set -o pipefail
          rm -rf "$GATE09_UNIT_RESULT_BUNDLE"
          perl -e 'alarm shift; exec @ARGV' 1800 xcodebuild -project Densoso.xcodeproj \
            -scheme Densoso \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 120 \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -only-testing:DensosoTests \
            -enableCodeCoverage YES \
            -resultBundlePath "$GATE09_UNIT_RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee gate09-integration-tests.log
          xcrun xcresulttool get test-results summary \
            --path "$GATE09_UNIT_RESULT_BUNDLE" > gate09-unit-test-summary.json
          grep -q '"result" : "Passed"' gate09-unit-test-summary.json
          xcrun xccov view --report "$GATE09_UNIT_RESULT_BUNDLE" > gate09-coverage-summary.txt

      - name: Run complete UI suite and capture integration screens
        run: |
          set -o pipefail
          rm -rf "$GATE09_UI_RESULT_BUNDLE"
          perl -e 'alarm shift; exec @ARGV' 1800 xcodebuild -project Densoso.xcodeproj \
            -scheme Densoso \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 120 \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -only-testing:DensosoUITests \
            -resultBundlePath "$GATE09_UI_RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee gate09-ui-tests.log
          xcrun xcresulttool get test-results summary \
            --path "$GATE09_UI_RESULT_BUNDLE" > gate09-ui-test-summary.json
          grep -q '"result" : "Passed"' gate09-ui-test-summary.json
          rm -rf Gate09Screenshots
          mkdir -p Gate09Screenshots
          xcrun xcresulttool export attachments \
            --path "$GATE09_UI_RESULT_BUNDLE" \
            --output-path Gate09Screenshots
          SCREENSHOT_COUNT="$(find Gate09Screenshots -type f -name '*.png' | wc -l | tr -d ' ')"
          test "$SCREENSHOT_COUNT" -ge 8
          echo "Exported $SCREENSHOT_COUNT Phase 9 screenshots."

      - name: Upload Gate 9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-09-integration-results
          path: |
            Gate09IntegrationTests.xcresult
            Gate09UITests.xcresult
            Gate09Screenshots
            gate09-domain.log
            gate09-integration-tests.log
            gate09-ui-tests.log
            gate09-unit-test-summary.json
            gate09-ui-test-summary.json
            gate09-coverage-summary.txt
            gate09-contract-summary.json
            docs/gates/gate-09-integration.md
          if-no-files-found: warn
          retention-days: 14

  final-acceptance:
    name: gate-10-final-acceptance
    needs:
      - foundation
      - domain-persistence
      - agent-provider
      - speech
      - meal-capture
      - healthkit
      - health-intelligence
      - watch
      - integration
    if: ${{ always() && inputs.run_scope != 'focused-pr-tests' }}
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      ACCEPTANCE_WORKFLOW_SHA: ${{ github.sha }}
      ACCEPTANCE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ACCEPTANCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GATE_01_RESULT: ${{ needs.foundation.result }}
      GATE_02_RESULT: ${{ needs.domain-persistence.result }}
      GATE_03_RESULT: ${{ needs.agent-provider.result }}
      GATE_04_RESULT: ${{ needs.speech.result }}
      GATE_05_RESULT: ${{ needs.meal-capture.result }}
      GATE_06_RESULT: ${{ needs.healthkit.result }}
      GATE_07_RESULT: ${{ needs.health-intelligence.result }}
      GATE_08_RESULT: ${{ needs.watch.result }}
      GATE_09_RESULT: ${{ needs.integration.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Gates 1–9 evidence from this workflow run
        uses: actions/download-artifact@v4
        with:
          pattern: gate-0*-results
          path: GateArtifacts
          merge-multiple: false

      - name: Prepare Gate 10 diagnostic files
        if: always()
        run: |
          mkdir -p Gate10Acceptance
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          gate_jobs = [
              (1, "foundation", "GATE_01_RESULT"),
              (2, "domain-persistence", "GATE_02_RESULT"),
              (3, "agent-provider", "GATE_03_RESULT"),
              (4, "speech", "GATE_04_RESULT"),
              (5, "meal-capture", "GATE_05_RESULT"),
              (6, "healthkit", "GATE_06_RESULT"),
              (7, "health-intelligence", "GATE_07_RESULT"),
              (8, "watch", "GATE_08_RESULT"),
              (9, "integration", "GATE_09_RESULT"),
          ]
          statuses = []
          for number, job, env_name in gate_jobs:
              outcome = os.environ.get(env_name, "unknown")
              if outcome == "success":
                  status = "PASS"
                  reason = "upstream job succeeded"
              elif outcome == "failure":
                  status = "FAIL"
                  reason = "upstream job failed"
              elif outcome == "cancelled":
                  status = "BLOCKED"
                  reason = "upstream job was cancelled"
              else:
                  status = "NOT RUN"
                  reason = "upstream job did not complete successfully"
              statuses.append({
                  "gate": number,
                  "job": job,
                  "jobOutcome": outcome,
                  "status": status,
                  "reason": reason,
              })

          bootstrap = {
              "status": "NOT RUN",
              "scope": "phase-10-final-software-acceptance-rollup",
              "workflowCommitSHA": os.environ.get("ACCEPTANCE_WORKFLOW_SHA", "unavailable"),
              "prHeadSHA": os.environ.get("ACCEPTANCE_PR_HEAD_SHA", "unavailable"),
              "workflowRun": os.environ.get("ACCEPTANCE_RUN_URL", "unavailable"),
              "gateResults": statuses,
              "errors": ["validator has not completed; inspect the Gate 10 validation step"],
              "signedDeviceAcceptance": "not-claimed",
              "testFlightOrProduction": "not-claimed",
          }
          Path("Gate10Acceptance/acceptance-manifest.json").write_text(
              json.dumps(bootstrap, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )

          lines = [
              "# Gate 10 diagnostic evidence",
              "",
              f"Workflow commit: `{bootstrap['workflowCommitSHA']}`",
              f"PR source head: `{bootstrap['prHeadSHA']}`",
              f"Run: {bootstrap['workflowRun']}",
              "",
              "| Gate | Job result | Status | Reason |",
              "| --- | --- | --- | --- |",
          ]
          lines.extend(
              f"| {item['gate']:02d} | {item['jobOutcome']} | {item['status']} | {item['reason']} |"
              for item in statuses
          )
          lines.extend([
              "",
              "The JSON manifest is initialized before validation so diagnostics survive an interrupted or failed validator step. Its final status is set by the validation step when that script completes.",
              "",
              "Apple signing, TestFlight, production use, signed-device HealthKit background delivery, and Watch pairing/offline behavior remain unverified and blocked.",
          ])
          Path("Gate10Acceptance/acceptance-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Validate Phase 10 final acceptance roll-up
        if: always()
        run: |
          python3 -m py_compile scripts/validate_phase10_final_acceptance.py
          mkdir -p Gate10Acceptance
          mkdir -p GateArtifacts
          python3 scripts/validate_phase10_final_acceptance.py \
            --artifact-root GateArtifacts \
            --workflow-sha "$ACCEPTANCE_WORKFLOW_SHA" \
            --pr-head-sha "$ACCEPTANCE_PR_HEAD_SHA" \
            --run-url "$ACCEPTANCE_RUN_URL" \
            --gate-result foundation="$GATE_01_RESULT" \
            --gate-result domain-persistence="$GATE_02_RESULT" \
            --gate-result agent-provider="$GATE_03_RESULT" \
            --gate-result speech="$GATE_04_RESULT" \
            --gate-result meal-capture="$GATE_05_RESULT" \
            --gate-result healthkit="$GATE_06_RESULT" \
            --gate-result health-intelligence="$GATE_07_RESULT" \
            --gate-result watch="$GATE_08_RESULT" \
            --gate-result integration="$GATE_09_RESULT" \
            --report Gate10Acceptance/acceptance-manifest.json

      - name: Upload Gate 10 acceptance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-10-final-acceptance-results
          path: |
            Gate10Acceptance
            docs/gates/gate-10-final-acceptance.md
          if-no-files-found: warn
          retention-days: 30

