            --run-url "$ACCEPTANCE_RUN_URL" \
            --report Gate10Acceptance/acceptance-manifest.json
          cat > Gate10Acceptance/acceptance-summary.md <<'EOF'
          # Phase 10 final software acceptance

          This manifest records the tested workflow commit SHA and PR source head SHA for one run. A pull-request run tests GitHub's generated merge candidate and proves only the defined software CI gates.

          Apple signing, TestFlight, production use, signed-device HealthKit background delivery, and Watch pairing/offline behavior remain unverified and blocked.
