  gate-17-food-data:
    name: gate-17-food-data-provenance
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      gate_status: ${{ steps.gate17_status.outputs.gate_status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Taiwan food-import dependency
        id: gate17_food_import_dependency
        if: always()
        run: |
          python3 -m pip install --no-index --no-deps --require-hashes -r requirements-food-import.txt

      - name: Compile Gate 17 validators
        id: gate17_compile
        if: always()
        run: |
          python3 -m py_compile \
            scripts/import_food_db.py \
            scripts/validate_food_db.py \
            scripts/import_recipe_priors.py \
            scripts/validate_recipe_priors.py \
            scripts/validate_recipe_prior_reproducibility.py \
            scripts/import_taiwan_fda_foods.py \
            scripts/validate_gate17_food_data.py

      - name: Validate packaged food database
        id: gate17_food_db
        if: always()
        run: |
          set -o pipefail
          python3 scripts/validate_food_db.py 2>&1 | tee gate17-food-db.log

      - name: Validate pinned recipe-prior catalog
        id: gate17_recipe_priors
        if: always()
        run: |
          set -o pipefail
          python3 scripts/validate_recipe_priors.py 2>&1 | tee gate17-recipe-priors.log

      - name: Rebuild recipe priors from the pinned upstream commit
        id: gate17_recipe_reproducibility
        if: always()
        run: |
          set -o pipefail
          python3 scripts/validate_recipe_prior_reproducibility.py \
            --report gate17-recipe-reproducibility.json 2>&1 \
            | tee gate17-recipe-reproducibility.log

      - name: Reproduce Taiwan FDA rows from the pinned archive
        id: gate17_taiwan_fda_reproducibility
        if: always()
        run: |
          set -o pipefail
          python3 scripts/import_taiwan_fda_foods.py --check 2>&1 \
            | tee gate17-taiwan-fda-reproducibility.log

      - name: Validate production import provenance and energy semantics
        id: gate17_provenance
        if: always()
        run: |
          set -o pipefail
          python3 scripts/validate_gate17_food_data.py 2>&1 | tee gate17-food-data-report.json

      - name: Record Gate 17 result
        id: gate17_status
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.gate17_compile.outcome }}
          FOOD_DB_OUTCOME: ${{ steps.gate17_food_db.outcome }}
          RECIPE_PRIORS_OUTCOME: ${{ steps.gate17_recipe_priors.outcome }}
          RECIPE_REPRODUCIBILITY_OUTCOME: ${{ steps.gate17_recipe_reproducibility.outcome }}
          TAIWAN_FDA_REPRODUCIBILITY_OUTCOME: ${{ steps.gate17_taiwan_fda_reproducibility.outcome }}
          FOOD_IMPORT_DEPENDENCY_OUTCOME: ${{ steps.gate17_food_import_dependency.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.gate17_provenance.outcome }}
        run: |
          if [ "$COMPILE_OUTCOME" = "success" ] \
            && [ "$FOOD_IMPORT_DEPENDENCY_OUTCOME" = "success" ] \
            && [ "$FOOD_DB_OUTCOME" = "success" ] \
            && [ "$RECIPE_PRIORS_OUTCOME" = "success" ] \
            && [ "$RECIPE_REPRODUCIBILITY_OUTCOME" = "success" ] \
            && [ "$TAIWAN_FDA_REPRODUCIBILITY_OUTCOME" = "success" ] \
            && [ "$PROVENANCE_OUTCOME" = "success" ]; then
            GATE_STATUS=PASS
          else
            GATE_STATUS=FAIL
          fi
          echo "gate_status=$GATE_STATUS" >> "$GITHUB_OUTPUT"
          echo "Gate 17: $GATE_STATUS"

      - name: Upload Gate 17 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-17-food-data-results
          path: |
            gate17-food-db.log
            gate17-recipe-priors.log
            gate17-recipe-reproducibility.log
            gate17-recipe-reproducibility.json
            gate17-taiwan-fda-reproducibility.log
            gate17-food-data-report.json
            docs/gates/gate-17-food-data-provenance.md
            Densoso/Resources/FoodData/taiwan_food_import_report.json
            Densoso/Resources/FoodData/taiwan_food_alias_review.json
          if-no-files-found: warn
          retention-days: 14

  gate-18-meal-estimates:
    name: gate-18-meal-estimate-usefulness
    if: ${{ always() }}
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      gate_status: ${{ steps.gate18_report.outputs.gate_status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Gate 18 paths
        run: |
          echo "GATE18_DERIVED_DATA_PATH=$RUNNER_TEMP/DensosoGate18DerivedData" >> "$GITHUB_ENV"
          echo "GATE18_RESULT_BUNDLE=$GITHUB_WORKSPACE/Gate18MealEstimateTests.xcresult" >> "$GITHUB_ENV"

      - name: Run deterministic meal-domain contracts
        id: gate18_resolution_domain
        if: always()
        run: |
          set +e
          set -o pipefail
          swift test --package-path Packages/DensosoDomain --filter MealResolutionTests 2>&1 | tee gate18-meal-resolution-domain.log
          TEST_EXIT=$?
          python3 - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          source = Path("Packages/DensosoDomain/Tests/DensosoDomainTests/MealResolutionTests.swift").read_text(encoding="utf-8")
          methods = re.findall(r"^\s*func\s+(test[A-Za-z0-9_]*)\s*\(", source, re.MULTILINE)
          command = ["python3", "scripts/validate_swiftpm_test_manifest.py", "--input", "gate18-meal-resolution-domain.log", "--report", "gate18-meal-resolution-domain-manifest.json"]
          for method in methods:
              command.extend(["--required", f"MealResolutionTests/{method}"])
          result = subprocess.run(command, check=False)
          sys.exit(result.returncode)
          PY
          MANIFEST_EXIT=$?
          if [ "$TEST_EXIT" -ne 0 ] || [ "$MANIFEST_EXIT" -ne 0 ]; then exit 1; fi

      - name: Run deterministic meal-quantity evidence contracts
        id: gate18_quantity_domain
        if: always()
        run: |
          set +e
          set -o pipefail
          swift test --package-path Packages/DensosoDomain --filter MealQuantityEvidenceTests 2>&1 | tee gate18-meal-quantity-domain.log
          TEST_EXIT=$?
          python3 - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          source = Path("Packages/DensosoDomain/Tests/DensosoDomainTests/MealQuantityEvidenceTests.swift").read_text(encoding="utf-8")
          methods = re.findall(r"^\s*func\s+(test[A-Za-z0-9_]*)\s*\(", source, re.MULTILINE)
          command = ["python3", "scripts/validate_swiftpm_test_manifest.py", "--input", "gate18-meal-quantity-domain.log", "--report", "gate18-meal-quantity-domain-manifest.json"]
          for method in methods:
              command.extend(["--required", f"MealQuantityEvidenceTests/{method}"])
          result = subprocess.run(command, check=False)
          sys.exit(result.returncode)
          PY
          MANIFEST_EXIT=$?
          if [ "$TEST_EXIT" -ne 0 ] || [ "$MANIFEST_EXIT" -ne 0 ]; then exit 1; fi

      - name: Generate project and prepare iOS Simulator
        id: gate18_simulator
        if: always()
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          SIMULATOR_LIST="$(perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl list devices available)"
          SIMULATOR_UDID="$(printf '%s\n' "$SIMULATOR_LIST" | sed -n 's/.*iPhone 17 Pro (\([A-F0-9-]*\)).*/\1/p' | sed -n '1p')"
          test -n "$SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl boot "$SIMULATOR_UDID" || true
          perl -e 'alarm shift; exec @ARGV' 180 xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Run focused meal capture and accounting integration tests
        id: gate18_ios
        if: ${{ always() && steps.gate18_simulator.outcome == 'success' }}
        run: |
          set -o pipefail
          perl -e 'alarm shift; exec @ARGV' 1500 xcodebuild -project Densoso.xcodeproj \
            -scheme Densoso \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 120 \
            -derivedDataPath "$GATE18_DERIVED_DATA_PATH" \
            -only-testing:DensosoTests/MultimodalAgentImageTests/testCompositePhotoMealKeepsSeparateDishesAndUsesLocalCalorieAccounting \
            -only-testing:DensosoTests/LogMealQuantityEvidenceTests \
            -only-testing:DensosoTests/RecipePriorCatalogTests \
            -only-testing:DensosoTests/MealCaptureApplicationServiceTests/testPrepareForAgentUsesTextFallbackForBarcodeMissAndImageOnlyForOpenPhoto \
            -only-testing:DensosoTests/ConfirmationCoordinatorTests/testConsumedFractionConfirmationPersistsScaledIntakeAndUserEvidence \
            -only-testing:DensosoTests/MealCalorieSummaryPresentationTests \
            -resultBundlePath "$GATE18_RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee gate18-meal-estimate-tests.log

      - name: Verify Gate 18 executed XCTest cases
        id: gate18_test_manifest
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          bundle = Path("Gate18MealEstimateTests.xcresult")
          raw_path = Path("gate18-xcresult-tests.json")
          if bundle.is_dir():
              extraction = subprocess.run(
                  ["xcrun", "xcresulttool", "get", "test-results", "tests", "--path", str(bundle), "--format", "json"],
                  check=False,
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
              )
              raw_path.write_text(extraction.stdout if extraction.returncode == 0 else "{}", encoding="utf-8")
          else:
              raw_path.write_text("{}", encoding="utf-8")

          required = [
              "DensosoTests/MultimodalAgentImageTests/testCompositePhotoMealKeepsSeparateDishesAndUsesLocalCalorieAccounting",
              "DensosoTests/MealCaptureApplicationServiceTests/testPrepareForAgentUsesTextFallbackForBarcodeMissAndImageOnlyForOpenPhoto",
              "DensosoTests/ConfirmationCoordinatorTests/testConsumedFractionConfirmationPersistsScaledIntakeAndUserEvidence",
              "DensosoTests/MealCalorieSummaryPresentationTests/testWideRangeKeepsLikelyAndConfidenceSeparateFromExpandableRange",
          ]
          source = Path("DensosoTests/Application/LogMealQuantityEvidenceTests.swift").read_text(encoding="utf-8")
          required.extend(
              f"DensosoTests/LogMealQuantityEvidenceTests/{method}"
              for method in re.findall(r"^\s*func\s+(test[A-Za-z0-9_]*)\s*\(", source, re.MULTILINE)
          )
          recipe_source = Path("DensosoTests/Application/RecipePriorCatalogTests.swift").read_text(encoding="utf-8")
          required.extend(
              f"DensosoTests/RecipePriorCatalogTests/{method}"
              for method in re.findall(r"^\s*func\s+(test[A-Za-z0-9_]*)\s*\(", recipe_source, re.MULTILINE)
          )
          command = ["python3", "scripts/validate_xcresult_test_manifest.py", "--input", str(raw_path), "--report", "gate18-xctest-manifest.json"]
          for method in required:
              command.extend(["--required", method])
          result = subprocess.run(command, check=False)
          sys.exit(result.returncode)
          PY

      - name: Export Gate 18 execution status
        id: gate18_report
        if: always()
        env:
          RESOLUTION_DOMAIN_OUTCOME: ${{ steps.gate18_resolution_domain.outcome }}
          QUANTITY_DOMAIN_OUTCOME: ${{ steps.gate18_quantity_domain.outcome }}
          IOS_OUTCOME: ${{ steps.gate18_ios.outcome }}
          IOS_MANIFEST_OUTCOME: ${{ steps.gate18_test_manifest.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          resolution_outcome = os.environ.get("RESOLUTION_DOMAIN_OUTCOME")
          quantity_outcome = os.environ.get("QUANTITY_DOMAIN_OUTCOME")
          ios_outcome = os.environ.get("IOS_OUTCOME")
          resolution_manifest = json.loads(Path("gate18-meal-resolution-domain-manifest.json").read_text(encoding="utf-8")) if Path("gate18-meal-resolution-domain-manifest.json").is_file() else {"status": "BLOCKED"}
          quantity_manifest = json.loads(Path("gate18-meal-quantity-domain-manifest.json").read_text(encoding="utf-8")) if Path("gate18-meal-quantity-domain-manifest.json").is_file() else {"status": "BLOCKED"}
          ios_manifest = json.loads(Path("gate18-xctest-manifest.json").read_text(encoding="utf-8")) if Path("gate18-xctest-manifest.json").is_file() else {"status": "BLOCKED", "requiredTests": []}
          outcomes = [resolution_outcome, quantity_outcome, ios_outcome, os.environ.get("IOS_MANIFEST_OUTCOME")]
          manifest_statuses = [resolution_manifest.get("status"), quantity_manifest.get("status"), ios_manifest.get("status")]
          if "FAIL" in manifest_statuses or (all(value == "PASS" for value in manifest_statuses) and any(value == "failure" for value in outcomes)):
              status = "FAIL"
          elif not all(value == "success" for value in outcomes) or any(value != "PASS" for value in manifest_statuses):
              status = "BLOCKED"
          else:
              status = "PASS"
          report = {
              "schemaVersion": 1,
              "gate": 18,
              "status": status,
              "headSha": os.environ.get("GITHUB_SHA"),
              "domainTests": {
                  "mealResolution": resolution_outcome,
                  "mealQuantityEvidence": quantity_outcome,
                  "mealResolutionManifest": resolution_manifest.get("status"),
                  "mealQuantityEvidenceManifest": quantity_manifest.get("status"),
              },
              "iOSIntegrationTests": ios_outcome,
              "iOSTestManifest": ios_manifest,
              "fieldCalibration": "NOT_MEASURED",
              "fieldCalibrationReason": "No real-world labeled meal dataset was supplied; field accuracy is not claimed.",
          }
          Path("gate18-meal-estimate-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"gate_status={status}\n")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload Gate 18 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-18-meal-estimate-results
          path: |
            Gate18MealEstimateTests.xcresult
            gate18-meal-resolution-domain.log
            gate18-meal-resolution-domain-manifest.json
            gate18-meal-quantity-domain.log
            gate18-meal-quantity-domain-manifest.json
            gate18-meal-estimate-tests.log
            gate18-xcresult-tests.json
            gate18-xctest-manifest.json
            gate18-meal-estimate-report.json
            docs/gates/gate-18-meal-estimate-usefulness.md
          if-no-files-found: warn
          retention-days: 14

  gate-19-cloud-health-window:
    name: gate-19-cloud-policy-health-window
    if: ${{ always() }}
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      gate_status: ${{ steps.gate19_status.outputs.gate_status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Gate 19 paths
        run: |
          echo "GATE19_DERIVED_DATA_PATH=$RUNNER_TEMP/DensosoGate19DerivedData" >> "$GITHUB_ENV"
          echo "GATE19_RESULT_BUNDLE=$GITHUB_WORKSPACE/Gate19PolicyHealthWindowTests.xcresult" >> "$GITHUB_ENV"

      - name: Run unknown and partial health-intelligence package contracts
        id: gate19_domain_health_intelligence
        if: always()
        run: |
          set +e
          set -o pipefail
          swift test --package-path Packages/DensosoDomain --filter 'HealthIntelligenceTests/(testUnknownHealthKitCoverageRemainsUnknownAndKnownValuesRemainPartial|testLegacyTrainingLoadCacheWithoutCoverageDecodesUnknownAndOmitsNumericPlaceholders|testLegacyHealthDomainVitalAndContextCachesFailClosedWithoutCoverage|testMetricWindowCoverageReportsThirtyAuthorizedDaysWithinFortyTwoDayTarget|testSleepWindowCoverageUsesFirstFullyAuthorizedWakeDay)' 2>&1 | tee gate19-domain-health-intelligence.log
          TEST_EXIT=$?
          python3 scripts/validate_swiftpm_test_manifest.py \
            --input gate19-domain-health-intelligence.log \
            --required HealthIntelligenceTests/testUnknownHealthKitCoverageRemainsUnknownAndKnownValuesRemainPartial \
            --required HealthIntelligenceTests/testLegacyTrainingLoadCacheWithoutCoverageDecodesUnknownAndOmitsNumericPlaceholders \
            --required HealthIntelligenceTests/testLegacyHealthDomainVitalAndContextCachesFailClosedWithoutCoverage \
            --required HealthIntelligenceTests/testMetricWindowCoverageReportsThirtyAuthorizedDaysWithinFortyTwoDayTarget \
            --required HealthIntelligenceTests/testSleepWindowCoverageUsesFirstFullyAuthorizedWakeDay \
            --report gate19-domain-health-intelligence-manifest.json
          MANIFEST_EXIT=$?
          if [ "$TEST_EXIT" -ne 0 ] || [ "$MANIFEST_EXIT" -ne 0 ]; then exit 1; fi

      - name: Run unknown and partial HealthState package contract
        id: gate19_domain_health_state
        if: always()
        run: |
          set +e
          set -o pipefail
          swift test --package-path Packages/DensosoDomain --filter 'HealthStateTests/testUnknownAndPartialDomainStatusesDoNotBecomeUsableRecoveryEvidence' 2>&1 | tee gate19-domain-health-state.log
          TEST_EXIT=$?
          python3 scripts/validate_swiftpm_test_manifest.py \
            --input gate19-domain-health-state.log \
            --required HealthStateTests/testUnknownAndPartialDomainStatusesDoNotBecomeUsableRecoveryEvidence \
            --report gate19-domain-health-state-manifest.json
          MANIFEST_EXIT=$?
          if [ "$TEST_EXIT" -ne 0 ] || [ "$MANIFEST_EXIT" -ne 0 ]; then exit 1; fi

      - name: Run unknown training-load narrative package contract
        id: gate19_domain_narrative
        if: always()
        run: |
          set +e
          set -o pipefail
          swift test --package-path Packages/DensosoDomain --filter 'HealthNarrativeTests/testNarrativeContextOmitsUnknownTrainingLoadZeroPlaceholders' 2>&1 | tee gate19-domain-narrative.log
          TEST_EXIT=$?
          python3 scripts/validate_swiftpm_test_manifest.py \
            --input gate19-domain-narrative.log \
            --required HealthNarrativeTests/testNarrativeContextOmitsUnknownTrainingLoadZeroPlaceholders \
            --report gate19-domain-narrative-manifest.json
          MANIFEST_EXIT=$?
          if [ "$TEST_EXIT" -ne 0 ] || [ "$MANIFEST_EXIT" -ne 0 ]; then exit 1; fi

      - name: Generate project and prepare iOS Simulator
        id: gate19_simulator
        if: always()
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          SIMULATOR_LIST="$(perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl list devices available)"
          SIMULATOR_UDID="$(printf '%s\n' "$SIMULATOR_LIST" | sed -n 's/.*iPhone 17 Pro (\([A-F0-9-]*\)).*/\1/p' | sed -n '1p')"
          test -n "$SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl boot "$SIMULATOR_UDID" || true
          perl -e 'alarm shift; exec @ARGV' 180 xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Run cloud-policy and 42-day HealthKit XCTest suites
        id: gate19_ios
        if: ${{ always() && steps.gate19_simulator.outcome == 'success' }}
        run: |
          set -o pipefail
          perl -e 'alarm shift; exec @ARGV' 1500 xcodebuild -project Densoso.xcodeproj \
            -scheme Densoso \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 120 \
            -derivedDataPath "$GATE19_DERIVED_DATA_PATH" \
            -only-testing:DensosoTests/CloudHealthContextPolicyTests \
            -only-testing:DensosoTests/HealthKitSyncCoordinatorTests \
            -only-testing:DensosoTests/DailyMetricsProjectionFingerprintTests/testProjectionInputReaderFiltersHealthKitWorkoutsByDailyReadState \
            -only-testing:DensosoTests/GetRecentWorkoutsToolTests/testRepositoryOmitsHealthKitWorkoutsWithUnknownOrMissingReadState \
            -only-testing:DensosoTests/HealthRepositoryTests/testUnknownAggregateStateDoesNotReuseAStaleMeasuredEnergyValue \
            -only-testing:DensosoTests/AgentProviderContextPolicyTests/testDeniedHealthClassSentinelsAreAbsentFromSerializedProviderContinuationBodies \
            -only-testing:DensosoTests/DeepSeekProviderContractTests/testPreSerializationConsentCheckStopsBeforeDeepSeekRequestIsSent \
            -only-testing:DensosoTests/QwenProviderContractTests/testPreSerializationConsentCheckStopsBeforeQwenRequestIsSent \
            -only-testing:DensosoTests/QwenMealVisionProviderContractTests/testSerializationConsentGateStopsBeforeNetworkRequest \
            -only-testing:DensosoTests/ProviderRetryPolicyTests/testDeepSeekStreamRetryRevalidatesCapturedPolicyRevision \
            -only-testing:DensosoTests/ProviderRetryPolicyTests/testQwenTextRetryRevalidatesCapturedPolicyRevision \
            -only-testing:DensosoTests/QwenMealVisionProviderContractTests/testQwenVisionRetryRevalidatesCapturedImagePolicyRevision \
            -only-testing:DensosoTests/ProviderRetryPolicyTests/testQwenASRRetryRejectsRevokedAndReconfirmedSpeechAudioConsent \
            -only-testing:DensosoTests/AgentRequestResumeTests/testPolicyRevocationDuringHealthToolExecutionFiltersTheContinuationRequest \
            -only-testing:DensosoTests/AgentRequestResumeTests/testAgentHealthPolicyAlignmentStagesDraftAndRequiresConversationConfirmation \
            -only-testing:DensosoTests/AgentRequestResumeTests/testConversationHistoryConsentDefaultsToCurrentTurnOnlyInProviderPayload \
            -only-testing:DensosoTests/AgentRequestResumeTests/testConfirmedConversationHistoryConsentIncludesCurrentRevisionHistoryInProviderPayload \
            -only-testing:DensosoTests/HealthIntelligenceServiceTests/testReadModelReportsPerMetricCoverageAcrossTheFortyTwoDayHealthWindow \
            -only-testing:DensosoTests/ExportServiceTests/testBackupDoesNotTransferCloudHealthConsentAndRestoreDefaultsToDenied \
            -only-testing:DensosoTests/ExportServiceTests/testRestoreInvalidatesCloudHealthAuthorizationAlreadyPresentInTargetStore \
            -only-testing:DensosoTests/GetHealthHistoryToolTests/testHistoryResponsePreservesUnknownAndPartialCoverageWithoutAbsenceOrZero \
            -only-testing:DensosoTests/GetHealthHistoryToolTests/testReadModelHistoryKeepsUnknownHealthKitCoverageTypedWithoutZeroObservations \
            -only-testing:DensosoTests/GetTodayHealthStateToolTests/testUnknownTrainingLoadOmitsZeroAndDerivedValuesAndReportsCoverage \
            -resultBundlePath "$GATE19_RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee gate19-cloud-health-window-tests.log

      - name: Export sanitized provider request evidence from XCTest attachments
        id: gate19_sanitized_request_export
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/Gate19AttachmentExport"
          destination="gate19-sanitized-provider-request-evidence.json"
          rm -rf "$export_dir"
          rm -f "$destination"
          mkdir -p "$export_dir"
          if [ ! -d Gate19PolicyHealthWindowTests.xcresult ]; then
            echo "Gate 19 XCTest result bundle is unavailable; sanitized request evidence is missing."
            exit 1
          fi
          xcrun xcresulttool export attachments \
            --path Gate19PolicyHealthWindowTests.xcresult \
            --output-path "$export_dir"
          python3 - "$export_dir" "$destination" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          export_root = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          expected_attachment_stem = "gate19-sanitized-provider-request-evidence"
          expected_test_class = "AgentProviderContextPolicyTests"
          expected_test_method = "testDeniedHealthClassSentinelsAreAbsentFromSerializedProviderContinuationBodies"
          exported_name_suffix = re.compile(r"_\d+_[0-9A-Fa-f-]+$")
          manifest_path = export_root / "manifest.json"
          if not manifest_path.is_file():
              raise SystemExit("xcresult attachment manifest is missing")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if not isinstance(manifest, list):
              raise SystemExit("xcresult attachment manifest has an unexpected schema")
          candidates = []
          for test_result in manifest:
              if not isinstance(test_result, dict):
                  continue
              test_identifier = test_result.get("testIdentifier", "")
              if not isinstance(test_identifier, str):
                  continue
              test_parts = test_identifier.split("/")
              if len(test_parts) < 2:
                  continue
              test_class, test_method = test_parts[-2:]
              if (
                  test_class != expected_test_class
                  or test_method.removesuffix("()") != expected_test_method
              ):
                  continue
              test_attachments = test_result.get("attachments", [])
              if not isinstance(test_attachments, list):
                  raise SystemExit("target XCTest attachment list has an unexpected schema")
              for attachment in test_attachments:
                  if not isinstance(attachment, dict):
                      raise SystemExit("target XCTest attachment entry has an unexpected schema")
                  suggested_name = attachment.get("suggestedHumanReadableName", "")
                  exported_name = attachment.get("exportedFileName", "")
                  uniform_type = attachment.get("uniformTypeIdentifier", "")
                  if not all(
                      isinstance(value, str)
                      for value in (suggested_name, exported_name, uniform_type)
                  ):
                      raise SystemExit("target XCTest attachment metadata has an unexpected schema")
                  if Path(suggested_name).name == suggested_name and suggested_name.endswith(".json"):
                      suggested_stem = Path(suggested_name).stem
                      suggested_stem = exported_name_suffix.sub("", suggested_stem)
                  else:
                      suggested_stem = ""
                  if suggested_stem == expected_attachment_stem:
                      candidates.append((suggested_name, exported_name, uniform_type))
          if len(candidates) != 1:
              raise SystemExit(
                  f"expected one Gate 19 sanitized request attachment, found {len(candidates)}"
              )
          _, exported_name, uniform_type = candidates[0]
          if (
              not isinstance(exported_name, str)
              or not exported_name
              or "/" in exported_name
              or "\\" in exported_name
              or Path(exported_name).suffix.lower() != ".json"
              or uniform_type != "public.json"
          ):
              raise SystemExit("the Gate 19 sanitized request attachment is not a JSON file")
          attachment_path = export_root / exported_name
          if not attachment_path.is_file():
              raise SystemExit("the Gate 19 sanitized request attachment file is missing")
          destination.write_bytes(attachment_path.read_bytes())
          print(f"Exported sanitized Gate 19 request evidence to {destination}.")
          PY

      - name: Verify Gate 19 executed XCTest cases
        id: gate19_test_manifest
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          bundle = Path("Gate19PolicyHealthWindowTests.xcresult")
          raw_path = Path("gate19-xcresult-tests.json")
          if bundle.is_dir():
              extraction = subprocess.run(
                  ["xcrun", "xcresulttool", "get", "test-results", "tests", "--path", str(bundle), "--format", "json"],
                  check=False,
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
              )
              raw_path.write_text(extraction.stdout if extraction.returncode == 0 else "{}", encoding="utf-8")
          else:
              raw_path.write_text("{}", encoding="utf-8")

          sys.path.insert(0, str(Path("scripts").resolve()))
          from validate_gate19_privacy_window import REQUIRED_TESTS

          command = ["python3", "scripts/validate_xcresult_test_manifest.py", "--input", str(raw_path), "--report", "gate19-xctest-manifest.json"]
          for method in REQUIRED_TESTS:
              command.extend(["--required", method])
          result = subprocess.run(command, check=False)
          sys.exit(result.returncode)
          PY

      - name: Export Gate 19 test execution evidence
        id: gate19_evidence
        if: always()
        env:
          IOS_OUTCOME: ${{ steps.gate19_ios.outcome }}
          HEALTH_INTELLIGENCE_OUTCOME: ${{ steps.gate19_domain_health_intelligence.outcome }}
          HEALTH_STATE_OUTCOME: ${{ steps.gate19_domain_health_state.outcome }}
          NARRATIVE_OUTCOME: ${{ steps.gate19_domain_narrative.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "scripts"))
          from validate_gate19_privacy_window import BEHAVIOR_CHECKS, REQUIRED_DOMAIN_TESTS, REQUIRED_TESTS

          def load_report(path):
              report_path = Path(path)
              if not report_path.is_file():
                  return {}
              try:
                  return json.loads(report_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return {}

          xctest_manifest = load_report("gate19-xctest-manifest.json")
          app_results = {}
          for item in xctest_manifest.get("requiredTests", []):
              name = item.get("testMethod")
              status = item.get("observedStatus")
              if isinstance(name, str):
                  app_results[name] = status if status in {"PASS", "FAIL", "BLOCKED", "NOT_MEASURED"} else "BLOCKED"

          package_results = {}
          for path in (
              "gate19-domain-health-intelligence-manifest.json",
              "gate19-domain-health-state-manifest.json",
              "gate19-domain-narrative-manifest.json",
          ):
              package_results.update(load_report(path).get("swiftPackageTestResults", {}))

          test_statuses = {**app_results, **package_results}
          for name in REQUIRED_TESTS:
              app_results.setdefault(name, "BLOCKED")
          for selector in REQUIRED_DOMAIN_TESTS:
              package_results.setdefault(selector, "BLOCKED")

          required_statuses = [*app_results.values(), *package_results.values()]
          if "FAIL" in required_statuses:
              test_status = "FAIL"
          elif required_statuses and all(value == "PASS" for value in required_statuses):
              test_status = "PASS"
          else:
              test_status = "BLOCKED"

          evidence_ref = "Gate19PolicyHealthWindowTests.xcresult; gate19-domain-*.log"
          sanitized_request_artifact = "gate19-sanitized-provider-request-evidence.json"

          def behavior_evidence(check_id):
              check = BEHAVIOR_CHECKS[check_id]
              dependencies = [test_statuses.get(name, "BLOCKED") for name in check.required_tests]
              if not dependencies:
                  status = "NOT_MEASURED"
              elif "FAIL" in dependencies:
                  status = "FAIL"
              elif all(value == "PASS" for value in dependencies):
                  status = "PASS"
              else:
                  status = "BLOCKED"
              if (
                  check_id == "provider_final_request_body"
                  and status == "PASS"
                  and not Path(sanitized_request_artifact).is_file()
              ):
                  status = "BLOCKED"
              value = {"status": status}
              if status == "PASS":
                  value["evidenceRef"] = (
                      sanitized_request_artifact
                      if check_id == "provider_final_request_body"
                      else evidence_ref
                  )
                  value.update({field: True for field in check.required_true})
                  for field, mode, number in check.required_numbers:
                      value[field] = number
                  if check.require_providers:
                      value["providers"] = ["deepSeek", "qwen"]
                  if check.require_health_classes:
                      value["forbiddenClassesChecked"] = [
                          "healthNutrition", "healthSleep", "healthActivity", "healthBody", "healthSubjective"
                      ]
              if check_id == "imported_backup_reconfirmation" and status == "PASS":
                  value["policyTransferredInBackup"] = False
                  value["restoredConsentDefaultsDenied"] = True
              if check_id == "health_window" and status == "PASS":
                  value["initialBackfillDays"] = 42
                  value["sameAnalysisAndSyncWindow"] = True
                  value["authorizationBoundaryRespected"] = True
              return value

          evidence = {
              "schemaVersion": 1,
              "gate": "gate-19-cloud-health-privacy-window",
              "headSha": os.environ.get("GITHUB_SHA"),
              "runId": os.environ.get("GITHUB_RUN_ID"),
              "testResults": app_results,
              "swiftPackageTestResults": package_results,
              "behaviorChecks": {
                  "provider_final_request_body": behavior_evidence("provider_final_request_body"),
                  "retry_attempt_authorization": behavior_evidence("retry_attempt_authorization"),
                  "provider_tool_output": behavior_evidence("provider_tool_output"),
                  "cached_and_continued_context": behavior_evidence("cached_and_continued_context"),
                  "consent_expansion_confirmation": behavior_evidence("consent_expansion_confirmation"),
                  "imported_backup_reconfirmation": behavior_evidence("imported_backup_reconfirmation"),
                  "health_window": behavior_evidence("health_window"),
                  "coverage_unknown_semantics": behavior_evidence("coverage_unknown_semantics"),
                  "rebaseline_idempotence": behavior_evidence("rebaseline_idempotence"),
                  "delete_recompute_idempotence": behavior_evidence("delete_recompute_idempotence"),
              },
          }
          Path("gate19-evidence.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "testStatus": test_status,
              "appTestCases": len(app_results),
              "swiftPackageTestCases": len(package_results),
              "manifest": "gate19-evidence.json",
          }, indent=2))
          PY

      - name: Validate Gate 19 contracts and produce status report
        id: validate_gate19
        if: always()
        continue-on-error: true
        run: |
          python3 -m py_compile \
            scripts/validate_gate19_privacy_window.py \
            scripts/validate_xcresult_test_manifest.py \
            scripts/validate_swiftpm_test_manifest.py
          python3 scripts/validate_gate19_privacy_window.py \
            --evidence gate19-evidence.json \
            --sanitized-provider-request-artifact gate19-sanitized-provider-request-evidence.json \
            --report gate19-report.json

      - name: Record Gate 19 status
        id: gate19_status
        if: always()
        env:
          IOS_OUTCOME: ${{ steps.gate19_ios.outcome }}
          HEALTH_INTELLIGENCE_OUTCOME: ${{ steps.gate19_domain_health_intelligence.outcome }}
          HEALTH_STATE_OUTCOME: ${{ steps.gate19_domain_health_state.outcome }}
          NARRATIVE_OUTCOME: ${{ steps.gate19_domain_narrative.outcome }}
          MANIFEST_OUTCOME: ${{ steps.gate19_test_manifest.outcome }}
          SANITIZED_REQUEST_EXPORT_OUTCOME: ${{ steps.gate19_sanitized_request_export.outcome }}
        run: |
          if [ -f gate19-report.json ]; then
            GATE_STATUS="$(python3 -c 'import json; print(json.load(open("gate19-report.json", encoding="utf-8"))["status"])')"
          else
            GATE_STATUS=FAIL
          fi
          if [ "$GATE_STATUS" = "PASS" ] \
            && { [ "$IOS_OUTCOME" = "failure" ] \
              || [ "$HEALTH_INTELLIGENCE_OUTCOME" = "failure" ] \
              || [ "$HEALTH_STATE_OUTCOME" = "failure" ] \
              || [ "$NARRATIVE_OUTCOME" = "failure" ] \
            || [ "$MANIFEST_OUTCOME" = "failure" ]; }; then
            GATE_STATUS=FAIL
          elif [ "$GATE_STATUS" = "PASS" ] \
            && { [ "$IOS_OUTCOME" != "success" ] \
              || [ "$HEALTH_INTELLIGENCE_OUTCOME" != "success" ] \
              || [ "$HEALTH_STATE_OUTCOME" != "success" ] \
              || [ "$NARRATIVE_OUTCOME" != "success" ] \
              || [ "$MANIFEST_OUTCOME" != "success" ] \
              || [ "$SANITIZED_REQUEST_EXPORT_OUTCOME" != "success" ]; }; then
            GATE_STATUS=BLOCKED
          fi
          echo "gate_status=$GATE_STATUS" >> "$GITHUB_OUTPUT"
          echo "Gate 19: $GATE_STATUS"

      - name: Upload Gate 19 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-19-cloud-health-window-results
          path: |
            Gate19PolicyHealthWindowTests.xcresult
            gate19-cloud-health-window-tests.log
            gate19-xcresult-tests.json
            gate19-xctest-manifest.json
            gate19-domain-health-intelligence.log
            gate19-domain-health-intelligence-manifest.json
            gate19-domain-health-state.log
            gate19-domain-health-state-manifest.json
            gate19-domain-narrative.log
            gate19-domain-narrative-manifest.json
            gate19-sanitized-provider-request-evidence.json
            gate19-evidence.json
            gate19-report.json
            docs/gates/gate-19-cloud-policy-health-window.md
          if-no-files-found: warn
          retention-days: 14

  gate-16-aggregate-contracts:
    name: gate-16-aggregate-contracts
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gate 16 status and release-readiness contracts
        run: |
          python3 -m py_compile \
            scripts/aggregate_gate16_release_readiness.py \
            scripts/validate_gate16_aggregate.py \
            scripts/validate_xcresult_test_manifest.py \
            scripts/validate_swiftpm_test_manifest.py
          python3 scripts/validate_gate16_aggregate.py

  gate-status:
    name: gate-16-final-release-aggregate-report
    needs:
      - foundation
      - domain-persistence
      - agent-provider
      - speech
      - meal-capture
      - healthkit
      - health-intelligence
      - watch
      - integration
      - final-acceptance
      - gate-11-ai-native-health-loop
      - gate-12-multimodal-agent
      - gate-13-energy-accounting
      - gate-14-watch-daily-loop
      - gate-17-food-data
      - gate-18-meal-estimates
      - gate-19-cloud-health-window
      - gate-16-aggregate-contracts
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aggregate automated gates and Gate 16 release readiness
        env:
          RUN_SCOPE: ${{ inputs.run_scope || 'full' }}
          GATE_16_AGGREGATE_CONTRACTS: ${{ needs.gate-16-aggregate-contracts.result }}
          GATE_01: ${{ needs.foundation.result }}
          GATE_02: ${{ needs.domain-persistence.result }}
          GATE_03: ${{ needs.agent-provider.result }}
          GATE_04: ${{ needs.speech.result }}
          GATE_05: ${{ needs.meal-capture.result }}
          GATE_06: ${{ needs.healthkit.result }}
          GATE_07: ${{ needs.health-intelligence.result }}
          GATE_08: ${{ needs.watch.result }}
          GATE_09: ${{ needs.integration.result }}
          GATE_10: ${{ needs.final-acceptance.result }}
          GATE_11: ${{ needs.gate-11-ai-native-health-loop.result }}
          GATE_12: ${{ needs.gate-12-multimodal-agent.result }}
          GATE_13: ${{ needs.gate-13-energy-accounting.result }}
          GATE_14: ${{ needs.gate-14-watch-daily-loop.result }}
          GATE_17: ${{ needs.gate-17-food-data.outputs.gate_status || needs.gate-17-food-data.result }}
          GATE_18: ${{ needs.gate-18-meal-estimates.outputs.gate_status || needs.gate-18-meal-estimates.result }}
          GATE_19: ${{ needs.gate-19-cloud-health-window.outputs.gate_status || needs.gate-19-cloud-health-window.result }}
        run: |
          set -euo pipefail
          python3 scripts/aggregate_gate16_release_readiness.py \
            --run-scope "$RUN_SCOPE" \
            --aggregate-contracts-result "$GATE_16_AGGREGATE_CONTRACTS" \
            --workflow-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --gate-result "1=$GATE_01" \
            --gate-result "2=$GATE_02" \
            --gate-result "3=$GATE_03" \
            --gate-result "4=$GATE_04" \
            --gate-result "5=$GATE_05" \
            --gate-result "6=$GATE_06" \
            --gate-result "7=$GATE_07" \
            --gate-result "8=$GATE_08" \
            --gate-result "9=$GATE_09" \
            --gate-result "10=$GATE_10" \
            --gate-result "11=$GATE_11" \
            --gate-result "12=$GATE_12" \
            --gate-result "13=$GATE_13" \
            --gate-result "14=$GATE_14" \
            --gate-result "17=$GATE_17" \
            --gate-result "18=$GATE_18" \
            --gate-result "19=$GATE_19" \
            --report gate16-release-readiness.json

      - name: Write Gate 16 report summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report_path = Path("gate16-release-readiness.json")
          if not report_path.is_file():
              raise SystemExit("Gate 16 report was not produced")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          lines = [
              "# Gate 16 final release aggregate",
              "",
              f"Automated checks: **{report['automatedChecksStatus']}**",
              f"Release readiness: **{report['releaseReadinessStatus']}**",
              f"Ready: **{report['ready']}**",
              f"Gate 16 contract validator: **{report['aggregateContractCheck']['status']}**",
              f"Field calibration: **{report['fieldCalibration']['status']}**",
              "",
              "| Gate | Status | Reason |",
              "| --- | --- | --- |",
          ]
          lines.extend(
              f"| {gate['gate']:02d} | {gate['status']} | {gate['reason']} |"
              for gate in sorted(report["gates"], key=lambda value: value["gate"])
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Upload Gate 16 aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-16-final-release-aggregate-results
          path: |
            gate16-release-readiness.json
            docs/gates/gate-15-real-device-acceptance.md
            docs/gates/gate-16-final-release-acceptance.md
          if-no-files-found: warn
          retention-days: 14
