name: Densoso
options:
  bundleIdPrefix: com.densoso
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

targets:
  Densoso:
    type: application
    platform: iOS
    sources:
      - path: Densoso
    resources:
      - path: Densoso/Resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.densoso.densoso
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: densoso
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "densoso 需要麦克风权限来采集语音输入。"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "densoso 需要语音识别权限来语音录入饮食和运动记录。"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "densoso 需要读取健康数据来获取体重和身高信息。"
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "densoso 需要写入饮食热量数据到 Apple Health。"
    entitlements:
      path: Densoso/Densoso.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies:
      - target: DensosoWatchApp
        embed: true
      - package: DensosoWorkoutDomain
      - package: GRDB
    preBuildScripts:
      - name: "Generate Food DB"
        script: |
          if [ ! -f "${SRCROOT}/Densoso/Resources/food_composition.db" ]; then
            python3 "${SRCROOT}/scripts/import_food_db.py" \
              --input "${SRCROOT}/Densoso/Resources/seed_foods.json" \
              --output "${SRCROOT}/Densoso/Resources/food_composition.db"
          fi
        inputFiles: []
        outputFiles:
          - ${SRCROOT}/Densoso/Resources/food_composition.db

  DensosoWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: DensosoWatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.densoso.densoso.watchkitapp
        SWIFT_VERSION: "6.0"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        INFOPLIST_FILE: DensosoWatchApp/Info.plist
    dependencies:
      - target: DensosoWatchExtension
        embed: true

  DensosoWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: DensosoWatchExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.densoso.densoso.watchkitextension
        SWIFT_VERSION: "6.0"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        INFOPLIST_FILE: DensosoWatchExtension/Info.plist
    entitlements:
      path: DensosoWatchExtension/DensosoWatchExtension.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies:
      - package: DensosoWorkoutDomain

  DensosoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DensosoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.densoso.densoso.tests
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Densoso

schemes:
  Densoso:
    build:
      targets:
        Densoso: all
    test:
      targets:
        - name: DensosoTests

packages:
  DensosoWorkoutDomain:
    path: Packages/DensosoWorkoutDomain
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"
